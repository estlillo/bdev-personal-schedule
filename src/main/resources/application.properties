spring.application.name=bdev-personal-schedule
spring.datasource.url=jdbc:sqlite:./rehab-scheduler.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON;
spring.sql.init.mode=never
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
availability.max-range-days=30
availability.max-professionals=7
availability.max-returned-slots=500
availability.default-step-minutes=45
institutional.schedule.day-start=08:00
institutional.schedule.day-end=17:00
institutional.schedule.slot-minutes=45
institutional.schedule.healthy-break-start=10:15
institutional.schedule.healthy-break-end=10:30
institutional.schedule.lunch-break-start=13:00
institutional.schedule.lunch-break-end=14:00
